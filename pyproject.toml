[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system_ident"
version = "0.0.1"
description = "Real-time, optimal-excitation system identification for LIGO suspensions (3-DoF: POS/Pitch/Yaw), with a digital-twin backend and a live operational dashboard."
readme = "src/system_ident/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Hang Yu", email = "hang.yu2@montana.edu" },
    { name = "Nathan Holland" },
    { name = "Rana X. Adhikari", email = "rana@caltech.edu" },
]
keywords = ["LIGO", "system-identification", "suspension", "controls", "CDS"]

# Core runtime deps. The CDS backend (nds2/awg) is optional and lazy-imported
# so the twin path works on a plain scientific-Python stack.
dependencies = [
    "numpy",
    "scipy",
    "control",
    "slycot",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dashboard = ["fastapi", "uvicorn[standard]", "websockets"]
# CDS libs (nds2-client, awg/cdsutils) are provided by the LIGO CDS
# environment and are not pip-installable here; listed for documentation.
cds = []
# plotly: tests/test_reduced_quad*.py and test_rtsfreerun_real_model.py import
# docs/reduced_quad_demo.py, which builds Plotly figures at module scope — so the
# suite does not collect without it, even though it is also in the docs extra.
dev = ["pytest", "pytest-cov", "pytest-xdist", "plotly"]
# griffe is pinned <2.0: griffe 2.0 dropped a kwarg quartodoc 0.11 still passes,
# breaking `quartodoc build`. Remove the pin once quartodoc supports griffe 2.x.
docs = ["quartodoc", "jupyter", "ipykernel", "griffe<2.0", "plotly"]

[project.scripts]
system_ident = "system_ident.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system_ident = ["py.typed", "configs/*.yml", "models/*.npz", "models/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
