name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the Pages-write/id-token scopes are
# granted only to the deploy job that needs them.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # graphics (SVG thumbnails, og-card) live in Git LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install slycot (Fortran-backed; needed by python-control MIMO)
        run: pip install slycot
      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          # The example .qmd files execute Python, so register a jupyter kernel.
          python -m ipykernel install --user --name python3 --display-name python3
      - name: Build API reference
        working-directory: docs
        run: quartodoc build
      - name: Render site
        run: quarto render docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
