name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the Pages-write/id-token scopes are
# granted only to the deploy job that needs them.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deliberately light: one Python, no docs stack, no Git LFS, no coverage upload.
  # `-m "not slow"` drops the three long Monte-Carlo / 6-DoF modal tests; anything
  # needing a compiled RTSfreerun twin or Playwright skips itself. Run the full
  # suite (plain `pytest`) locally before pushing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7      # no lfs: only graphics are in LFS, tests need none
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + test deps
        # uv resolves in seconds and pulls the slycot wheel rather than building it.
        run: |
          python -m pip install --upgrade uv
          uv pip install --system -e ".[dev,dashboard]"
      - name: Run the light test selection
        # -n auto (4 workers on a standard runner) with the BLAS thread pools pinned to
        # 1: the tests are numpy-heavy, so leaving BLAS free to thread would oversubscribe
        # the same 4 cores the workers already fill. Measured on 4 pinned cores locally:
        # 81.5 s -> 44.7 s.
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -m "not slow" -q -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true          # graphics (SVG thumbnails, og-card) live in Git LFS
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Cache executed example results (docs/_freeze)
        # Executing the examples was 225 s of this job. The --profile ci render below sets
        # `freeze: auto`, so a restored cache lets quarto skip re-execution.
        #
        # The key hashes everything a figure's numbers can depend on — library source, the
        # docs helper modules, the pages themselves, and the committed freeze results — so
        # touching any of them misses the cache and re-executes the lot. There are
        # deliberately NO restore-keys: a partial match would serve figures computed from
        # older source, which is exactly the kind of quiet staleness the provenance gate
        # exists to prevent.
        uses: actions/cache@v6
        with:
          path: docs/_freeze
          key: freeze-${{ hashFiles('src/**/*.py', 'docs/**/*.py', 'docs/**/*.qmd', 'docs/_freeze/**') }}
      - name: Install package + docs deps
        # uv, and no separate slycot step: PyPI ships a slycot wheel, so nothing is built
        # from source here. 38 s -> a few seconds.
        run: |
          python -m pip install --upgrade uv
          uv pip install --system -e ".[docs]"
          # The example .qmd files execute Python, so register a jupyter kernel.
          python -m ipykernel install --user --name python3 --display-name python3
      - name: Provenance gate — no fabricated ("ASSUMED") numbers may ship
        # Fast (~1 s): import the physics modules and fail if any physical input is an un-reviewed
        # placeholder. Run as plain Python (no pytest — it is not a CI dependency; the full
        # tests/test_provenance.py suite stays local). require_grounded() raises on any ASSUMED value.
        run: |
          python - <<'PY'
          import importlib
          from system_ident import provenance as prov
          for m in ("system_ident.darm", "system_ident.darm_callines"):
              importlib.import_module(m)
          prov.require_grounded()
          bad = [e.name for e in prov.registry().values() if e.kind != prov.CONSTANT and not e.source]
          assert not bad, f"registered values missing a source: {bad}"
          print(f"provenance gate OK — {len(prov.registry())} grounded physical inputs")
          PY
      - name: Build API reference
        working-directory: docs
        run: quartodoc build
      - name: Render site
        # --profile ci merges docs/_quarto-ci.yml (freeze: auto). A plain local
        # `quarto render docs` is unaffected and still executes every page.
        run: quarto render docs --profile ci
      - name: Render the talks and fold them into the site
        # ~3 s: the deck has NO executable cells (every number reaches it through the
        # generated talks/_variables.yml), so this is pandoc plus a file copy — measured
        # 2.7 s cold against the 55 s docs render. talks/ stays its own Quarto project so
        # that _variables.yml keeps working; we just graft its output in under /talks/.
        # Needs the LFS checkout above — the deck's 28 figures are SVGs stored in LFS.
        run: |
          quarto render talks
          mkdir -p docs/_site/talks
          cp -R talks/_site/. docs/_site/talks/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: [test, build]    # don't publish docs from a tree with failing tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
