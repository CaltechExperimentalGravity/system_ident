name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the Pages-write/id-token scopes are
# granted only to the deploy job that needs them.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deliberately light: one Python, no docs stack, no Git LFS, no coverage upload.
  # `-m "not slow"` drops the three long Monte-Carlo / 6-DoF modal tests; anything
  # needing a compiled RTSfreerun twin or Playwright skips itself. Run the full
  # suite (plain `pytest`) locally before pushing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7      # no lfs: only graphics are in LFS, tests need none
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + test deps
        # uv resolves in seconds and pulls the slycot wheel rather than building it.
        run: |
          python -m pip install --upgrade uv
          uv pip install --system -e ".[dev,dashboard]"
      - name: Run the light test selection
        run: pytest -m "not slow" -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true          # graphics (SVG thumbnails, og-card) live in Git LFS
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install slycot (Fortran-backed; needed by python-control MIMO)
        run: pip install slycot
      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          # The example .qmd files execute Python, so register a jupyter kernel.
          python -m ipykernel install --user --name python3 --display-name python3
      - name: Provenance gate — no fabricated ("ASSUMED") numbers may ship
        # Fast (~1 s): import the physics modules and fail if any physical input is an un-reviewed
        # placeholder. Run as plain Python (no pytest — it is not a CI dependency; the full
        # tests/test_provenance.py suite stays local). require_grounded() raises on any ASSUMED value.
        run: |
          python - <<'PY'
          import importlib
          from system_ident import provenance as prov
          for m in ("system_ident.darm", "system_ident.darm_callines"):
              importlib.import_module(m)
          prov.require_grounded()
          bad = [e.name for e in prov.registry().values() if e.kind != prov.CONSTANT and not e.source]
          assert not bad, f"registered values missing a source: {bad}"
          print(f"provenance gate OK — {len(prov.registry())} grounded physical inputs")
          PY
      - name: Build API reference
        working-directory: docs
        run: quartodoc build
      - name: Render site
        run: quarto render docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: [test, build]    # don't publish docs from a tree with failing tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
