# environment_deploy_lock.yml
#
# DEPLOYMENT LOCK for the `sysid_deploy` hardware environment (linux-64). This is the exact,
# version-pinned export of the environment actually created on the CDS workstation, and it is the
# source of truth for versions. `environment_deploy.yml` is the human-readable declarative spec.
#
# Generated with:  conda env export -n sysid_deploy --no-builds
# The trailing `prefix:` line is REMOVED on purpose -- it is an on-machine path and this repo is
# public (see the sensitive-file manifest). Do NOT paste it back in.
#
# Do NOT edit by hand -- regenerate from the deployment machine.
#
# Built 2026-08-03 from the lean spec in `environment_deploy.yml`, pinned to the CDS-published
# python 3.11 environment (`cds-py311.yaml`, 2026-03-12). Validated read-only on the deployment
# machine the same day:
#   - python 3.11.15 / numpy 1.26.4 / scipy 1.13.1 / control 0.10.2 / slycot 0.6.1
#   - awg, foton, gpstime, nds2 (0.16.12) and cdsutils (1.7.0) all import
#   - deployment-gate test subset: 61 passed / 1 skipped  (identical to the py3.9 baseline)
#   - full suite: 290 passed / 8 failed / 17 skipped -- all 8 failures are `np.trapezoid`
#     (numpy < 2.0) in the arcade/playground half; see issue #23
#   - read-only NDS fetch returned live data at the expected rate; NO injection was performed
#
# The awg *injection* path is NOT validated: awg here is 4.1.4, while the only client proven
# against the site's real-time system (advLigoRTS branch-3.4) is 3.1.2. That test needs an
# operator, a human-chosen channel pair, and separate approval for EVERY injection. See issue #27
# and CLAUDE.md section "Hardware safety".
#
