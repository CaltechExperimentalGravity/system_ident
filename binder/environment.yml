# Binder (mybinder.org) environment — launches the pip-runnable worked examples as live
# Jupyter notebooks. postBuild converts the Quarto .qmd examples to native .ipynb (which the
# Binder badges open directly); jupytext additionally lets the raw .qmd open as notebooks.
# The compiled-CDS examples (07, 10) need the RTSfreerun twin and do NOT run here.
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - control
  - slycot            # python-control MIMO backend (conda-forge has a wheel)
  - quarto            # `quarto convert` the .qmd examples to runnable notebooks (postBuild)
  - jupyterlab
  - jupytext          # also opens raw .qmd as notebooks
  - ipykernel
  - pip
  - pip:
      - plotly        # the docs figures are Plotly
