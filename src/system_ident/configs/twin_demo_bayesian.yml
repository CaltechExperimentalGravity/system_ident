# Bad-prior Bayesian loop demo:
#
#   system_ident run src/system_ident/configs/twin_demo_bayesian.yml --twin --yes
#
# Single DoF (POS).  Plant: 1.0 Hz Q20 resonance, gain=100.
# Prior: deliberately wrong (0.6 Hz Q6, gain=20) so the Bayesian loop must
# crawl from the prior toward truth over several passes.  Noisy twin
# (sensor + disturbance) to keep the per-pass information limited.

run:
  name: twin_demo_bayesian
  excitation_mode: sequential

channels:
  excitation:
    POS: C1:SUS-BAY_TM_POS_EXC
  readback:
    POS: C1:SUS-BAY_TM_POS_RESP

measurement:
  fs: 32
  freq_min: 0.1
  freq_max: 5.0
  segment_duration: 64.0
  n_segments: 4
  px_total: 1.0
  t_ramp: 4.0

strategy:
  estimator: invfreqs
  input_designer: pintelon_schoukens
  n_design_iter: 3
  loop: bayesian
  prior_uncertainty: 0.5

# Digital-twin plant dynamics.
twin:
  sensor_asd: 3.0e-4
  disturbance_asd: 2.0e-4
  plant:
    POS:
      resonances: [[1.0, 20]]
      gain: 100

# Bad starting model — deliberately far from the plant above.
priors:
  POS:
    resonances: [[0.6, 6]]
    gain: 20

# Generous safety limits so the demo always runs all 6 passes.
safety:
  actuator_sat: 1.0e6
  rms_ceiling:
    POS: 1.0e6
  ramp_down_secs: 2.0

# Unreachable target forces all max_iter passes to run.
stop_criteria:
  uncertainty_target: 1.0e-9
  max_iter: 6
