# Bayesian refinement demo (the usual operating case):
#
#   system_ident run src/system_ident/configs/twin_demo_bayesian.yml --twin --yes
#
# Single DoF (POS). Plant: 1.0 Hz Q20 resonance, gain=100.
# Prior: a GOOD prior (0.9 Hz Q15, gain=80) — close enough that its resonance
# overlaps the true one — refined by WEAK (low-SNR) measurements. The Bayesian
# loop takes small damped steps and crawls toward truth over many passes while
# the uncertainty shrinks. (For a far/wrong prior, characterise with a broadband
# sweep first — see twin_demo.yml / the broadband_ls loop mode.)

run:
  name: twin_demo_bayesian
  excitation_mode: sequential

channels:
  excitation:
    POS: C1:SUS-BAY_TM_POS_EXC
  readback:
    POS: C1:SUS-BAY_TM_POS_RESP

measurement:
  fs: 32
  freq_min: 0.1
  freq_max: 5.0
  segment_duration: 64.0
  n_segments: 4
  px_total: 1.0
  t_ramp: 4.0

strategy:
  estimator: invfreqs
  input_designer: pintelon_schoukens
  n_design_iter: 3
  loop: bayesian
  prior_uncertainty: 0.4   # confidence in the prior (smaller = more anchored)
  exploration: 0.3         # fraction of drive power spread flat (exploration floor)

# Digital-twin plant dynamics + noise (weak measurements: low SNR).
twin:
  sensor_asd: 3.0e-3
  disturbance_asd: 3.0e-3
  plant:
    POS:
      resonances: [[1.0, 20]]
      gain: 100

# A good starting model (in the right basin), refined over the campaign.
priors:
  POS:
    resonances: [[0.9, 15]]
    gain: 80

# Generous safety limits so the demo runs all passes.
safety:
  actuator_sat: 1.0e6
  rms_ceiling:
    POS: 1.0e6
  ramp_down_secs: 2.0

# Unreachable target forces all max_iter passes to run (watch the crawl).
stop_criteria:
  uncertainty_target: 1.0e-9
  max_iter: 15
