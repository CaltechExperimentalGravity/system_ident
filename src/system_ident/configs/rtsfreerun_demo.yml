# Identify a LIGO digital-twin suspension (RTSfreerun) under realistic noise.
#
# Drives a *compiled* rtsfreerun model (GIT/digital_twin/, model `x1hsts`) with the
# Pintelon-Schoukens optimal-excitation pipeline and recovers the drive->sensor
# suspension plant while the twin's own seismic + readout noise runs in the loop.
#
# Run on a box where BOTH `system_ident` and the built `x1hsts` model are importable
# (e.g. `pip install -e <system_ident>` into the digital-twin `twin` conda env):
#   system_ident run src/system_ident/configs/rtsfreerun_demo.yml --rtsfreerun --yes
#
# This is a SKELETON: channel names are from digital_twin/twin/scenarios/hsts.yaml;
# verify them against your build, and tune the prior / band / durations. Start small.

run:
  name: rtsfreerun_hsts
  excitation_mode: sequential

channels:
  excitation:
    POS: COIL_DRIVER_EXC        # inject the multisine at the actuator (coil driver)
  drive:
    POS: COIL_DRIVER_OUT        # after-actuator drive monitor u  ->  FRF input X
  readback:
    POS: READOUT_NOISE_OUT      # sensor displacement (16-bit ADC in the model)  ->  Y

measurement:
  fs: 256                       # analysis rate; the adapter decimates the 16384 Hz model
  freq_min: 0.3
  freq_max: 8.0
  segment_duration: 16.0        # T_fft = 16 s (> 3/f_min); nperseg = 16*256 = 4096
  n_segments: 4
  px_total: 1.0e6               # drive power budget (counts²); tune to stay inside the limit
  t_ramp: 2.0

strategy:
  estimator: gml
  input_designer: pintelon_schoukens
  n_design_iter: 3
  prior_uncertainty: 0.5

rtsfreerun:
  model: x1hsts                 # the built rtsfreerun module to import
  warmup_s: 5.0                 # settle slow loop modes before recording (discarded)
  noise:                        # the twin's realistic background, injected each read
    - {channel: ISI_RESIDUAL_EXC,  kind: seismic, params: {preset: ligo-india}}
    - {channel: READOUT_NOISE_EXC, kind: bosem,   params: {floor: 1.0e-10, knee_hz: 1.0}}

priors:
  POS:
    resonances: [[0.9, 10]]     # starting guess for the HSTS longitudinal mode; refine
    gain: 1.0

safety:
  actuator_sat: 30000.0         # matches the model's COIL_DRIVER_LIMIT
  rms_ceiling:
    POS: 1.0e9
  ramp_down_secs: 2.0

stop_criteria:
  uncertainty_target: 0.05
  max_iter: 3
