# NOTE: run `quartodoc build` (from this docs/ dir) before `quarto render` —
# it generates reference/*.qmd and reference/_sidebar.yml referenced below.
project:
  type: website
  output-dir: _site
  execute-dir: project   # run every page from docs/ so `import sysid_plots` resolves
  render:
    - index.qmd
    - tutorial/*.qmd
    - examples/*.qmd
    - reference/*.qmd

website:
  title: "system_ident"
  description: "Optimal-excitation system identification for LIGO suspensions."
  favicon: "favicon.svg"
  site-url: "https://caltechexperimentalgravity.github.io/system_ident/"
  image: "assets/og-card.png"          # default social-card preview
  open-graph: true
  twitter-card: true
  page-navigation: true                 # prev/next links at the page foot
  back-to-top-navigation: true          # floating back-to-top button
  navbar:
    logo: "favicon.svg"
    logo-alt: "system_ident logo"
    left:
      - href: index.qmd
        text: Home
      - text: Tutorial
        menu:
          - href: tutorial/overview.qmd
            text: The method
          - href: tutorial/model.qmd
            text: The model
          - href: tutorial/fisher.qmd
            text: Fisher & excitation
          - href: tutorial/closing-the-loop.qmd
            text: Closing the loop
          - href: tutorial/safety-and-ops.qmd
            text: Safety & operations
      - href: examples/index.qmd
        text: Examples
      - href: reference/index.qmd
        text: API Reference
    right:
      - icon: github
        href: https://github.com/CaltechExperimentalGravity/system_ident
        aria-label: GitHub repository
  sidebar:
    - id: reference
      contents: reference/_sidebar.yml
  page-footer:
    left: "Built with [Quarto](https://quarto.org)."
    right: "**system_ident** — LIGO interferometer system identification."

metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: true              # collapse code blocks by default — focus on the plots
    code-summary: "Show the code"
    code-tools: true             # page-level expand/collapse-all toggle
    code-annotations: hover      # numbered callouts on code lines
    code-overflow: wrap
    code-line-numbers: false
    highlight-style:             # syntax tokens follow the light/dark toggle
      light: github
      dark: github-dark
    smooth-scroll: true
    reading-time: true           # "N min read" on each page
    lightbox: auto               # click any figure to zoom (quarto-ext/lightbox)
    mermaid:
      theme: neutral
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

jupyter: python3

quartodoc:
  package: system_ident
  dir: reference
  title: API Reference
  style: pkgdown
  sidebar: reference/_sidebar.yml
  sections:
    - title: Core
      desc: "Model, Fisher information, excitation synthesis, and the loop."
      contents:
        - model.TFModel
        - fisher.fisher_matrix
        - fisher.parameter_covariance
        - fisher.dispersion
        - excitation.multisine_from_psd
        - loop.SysIDLoop
        - loop.LoopResult
    - title: Estimators
      desc: "Fit a transfer function to measured data."
      contents:
        - estimators.base.Estimator
        - estimators.gml.GMLEstimator
        - estimators.invfreqs.invfreqs
    - title: Input design
      desc: "Design the excitation spectrum."
      contents:
        - design.base.InputDesigner
        - design.pintelon.PintelonSchoukensDesigner
        - design.pintelon.optimal_excitation
    - title: Plant & backends
      desc: "Plant models and the channel API (twin / hardware)."
      contents:
        - plant.SuspensionPlant
        - plant.double_pendulum
        - plant.coupled_suspension
        - backends.base.ChannelBackend
        - backends.twin.TwinBackend
    - title: Safety & configuration
      desc: "Watchdog, limits, and run configuration."
      contents:
        - safety.SafetyLimits
        - safety.Watchdog
        - config.RunConfig
