# A small, self-contained Quarto project for talks — deliberately SEPARATE from the
# documentation site (`docs/_quarto.yml`), whose render list never reaches up here.
# Its only job is to give `_variables.yml` (generated by make_figs.py) a project to
# live in, so the deck can quote measured numbers via `{{< var … >}}` instead of
# transcribed ones — and so the deck renders without a Jupyter kernel.
project:
  type: default
  output-dir: _site
  render:
    - "*.qmd"
